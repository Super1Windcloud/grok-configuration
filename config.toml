[cli]
installer = "internal"

[marketplace]
default_skills_installs_purged = true
official_marketplace_auto_installed = true

[[marketplace.sources]]
name = "xAI Official"
git = "https://github.com/xai-org/plugin-marketplace.git"

[ui]
theme = "tokyonight"
permission_mode = "always-approve"
show_timeline = true
timestamps = "on"
tool_call_density = "detailed"
max_thoughts_width = 120
fork_secondary_model = "grok-4.6"
combine_queued_prompts = true
compact_mode = false
cursor_blink = false
confirm_before_rewind = true

[ui.status_line]
type = "command"
command = "~/.grok/statusline.sh"

[models]
default = "grok-4.7"
default_reasoning_effort = "medium"

[model.aigo-grok]
model = "grok-4.6"
name = "Aigo Grok"
base_url = "https://aigo.hair/v1"
api_backend = "chat_completions"

[permission]
deny = [
    "Read(~/.ssh/**)",
    "Edit(~/.ssh/**)",
    "Read(~/.aws/**)",
    "Edit(~/.aws/**)",
    "Read(~/.gnupg/**)",
    "Edit(~/.gnupg/**)",
    "Read(**/*.pem)",
    "Edit(**/*.pem)",
    "Read(**/*.keystore)",
    "Edit(**/*.keystore)",
    "Read(**/*.jks)",
    "Edit(**/*.jks)",
    "Read(**/*.p12)",
    "Edit(**/*.p12)",
    "Read(**/.env.production)",
    "Edit(**/.env.production)",
    "Edit(~/.zshrc)",
    "Edit(~/.zshenv)",
]

[sandbox]
profile = "workspace"
auto_allow_bash = true

[subagents]
enabled = true
max_concurrent = 4
limit_behavior = "queue"

[memory]
enabled = true

[memory_v2]
enabled = true
batch_dream_enabled = true

[goal]
enabled = true

[doom_loop_recovery]
enabled = true

[compat.claude]
agents = true
hooks = true
mcps = true
rules = true
skills = true

[compat.cursor]
rules = true
skills = true
mcps = true

[compat.codex]
skills = true
hooks = true

[mcp_servers.mobile-mcp]
command = "/opt/homebrew/bin/mcp-server-mobile"
enabled = true

[mcp_servers.mobile-mcp.env]
ANDROID_SDK_ROOT = "${HOME}/Library/Android/sdk"
ANDROID_HOME = "${HOME}/Library/Android/sdk"
PATH = "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:${HOME}/Library/Android/sdk/platform-tools"

[mcp_servers.scrcpy]
command = "/opt/homebrew/bin/scrcpy-mcp"
enabled = true

[mcp_servers.scrcpy.env]
ADB_PATH = "${HOME}/Library/Android/sdk/platform-tools/adb"
PATH = "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:${HOME}/Library/Android/sdk/platform-tools"

[mcp_servers.reqable]
command = "/opt/homebrew/bin/reqable-mcp-server"
enabled = true

[mcp_servers.reqable.env]
PATH = "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

[plugins]
enabled = ["testkit"]

[mcp_servers."mitmproxy-mcp"]
command = "uvx"
args = ["--directory", "~/.grok/runtime/mitmproxy", "--no-config", "--python", "3.13", "--with", "mcp<2", "--from", "mitmproxy-mcp==0.6.1", "mitmproxy-mcp"]
enabled = true
startup_timeout_sec = 120
[mcp_servers."mitmproxy-mcp".env]
UV_CACHE_DIR = "~/.grok/runtime/mitmproxy/uv-cache"
UV_TOOL_DIR = "~/.grok/runtime/mitmproxy/uv-tools"
